<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Command Center V2</title>
    <script src="{{ url_for('static', filename='js/tailwindcss.js') }}"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/all.min.css') }}">
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex items-center justify-center p-4 transition-colors duration-200">

    <!-- TOGGLE TEMA -->
    <div class="fixed top-5 right-5">
        <button onclick="toggleTheme()" class="p-3 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-full shadow-lg text-slate-600 dark:text-slate-300 hover:text-amber-500 dark:hover:text-amber-400 transition">
            <i id="themeIcon" class="fa-solid fa-moon text-lg"></i>
        </button>
    </div>

    <!-- CARD LOGIN -->
    <div class="max-w-md w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-8 shadow-xl dark:shadow-2xl transition-all">
        
        <!-- HEADER LOGO -->
        <div class="text-center mb-8">
            <div class="flex justify-center mb-4">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo Perusahaan" class="h-24 w-auto object-contain">
            </div>
            <h1 class="text-2xl font-bold text-slate-900 dark:text-white tracking-tight">Command Center</h1>
            <p class="text-slate-500 dark:text-slate-400 text-sm mt-1">Masuk untuk mengakses dashboard operasional</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="mb-5 p-4 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-600 dark:text-rose-400 text-sm flex items-center gap-3">
                        <i class="fa-solid fa-circle-exclamation text-base"></i>
                        <span>{{ message }}</span>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/login" method="POST" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-2">Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                        <i class="fa-solid fa-user text-sm"></i>
                    </span>
                    <input type="text" name="username" required placeholder="Masukkan username" class="w-full bg-slate-100 dark:bg-slate-800/80 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white rounded-xl pl-10 pr-4 py-3 text-sm focus:outline-none focus:border-cyan-500 transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-2">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                        <i class="fa-solid fa-lock text-sm"></i>
                    </span>
                    <input type="password" name="password" required placeholder="••••••••" class="w-full bg-slate-100 dark:bg-slate-800/80 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white rounded-xl pl-10 pr-4 py-3 text-sm focus:outline-none focus:border-cyan-500 transition">
                </div>
            </div>

            <button type="submit" class="w-full py-3 bg-cyan-600 hover:bg-cyan-500 text-white font-semibold text-sm rounded-xl shadow-lg shadow-cyan-600/20 transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-right-to-bracket"></i> Masuk Sistem
            </button>
        </form>

        <div class="mt-8 text-center border-t border-slate-100 dark:border-slate-800/80 pt-6">
            <p class="text-xs text-slate-400 dark:text-slate-500">© 2026 PT Mitrabuana Widyasakti. All rights reserved.</p>
        </div>
    </div>

    <script>
        function updateIcon() {
            const icon = document.getElementById('themeIcon');
            if (document.documentElement.classList.contains('dark')) {
                icon.className = 'fa-solid fa-sun text-amber-400';
            } else {
                icon.className = 'fa-solid fa-moon text-slate-600';
            }
        }

        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
            updateIcon();
        }

        updateIcon();
    </script>
</body>
</html>
