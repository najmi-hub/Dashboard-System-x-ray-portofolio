{% extends "base_v2.html" %}
{% block content %}
<div class="container mt-4">
  <h3>Realtime Monitoring - Folder Z:</h3>
  <p class="text-muted">Menampilkan folder scan terbaru secara otomatis.</p>

  <table class="table table-bordered table-sm" id="realtime-table">
    <thead class="table-dark">
      <tr>
        <th>No</th>
        <th>ID Scan</th>
        <th>Path</th>
        <th>Jumlah Gambar</th>
        <th>Waktu Update</th>
      </tr>
    </thead>
    <tbody>
      <tr><td colspan="5" class="text-center">Memuat data...</td></tr>
    </tbody>
  </table>
</div>

<script>
async function loadRealtimeData() {
  const res = await fetch("/api/realtime-data");
  const data = await res.json();
  const tbody = document.querySelector("#realtime-table tbody");
  tbody.innerHTML = "";
  if (data.length === 0) {
    tbody.innerHTML = "<tr><td colspan='5' class='text-center'>Tidak ada data</td></tr>";
    return;
  }
  data.forEach((item, idx) => {
    tbody.innerHTML += `
      <tr>
        <td>${idx + 1}</td>
        <td>${item.scan_id}</td>
        <td>${item.path}</td>
        <td>${item.img_count}</td>
        <td>${item.last_update}</td>
      </tr>`;
  });
}

// auto refresh setiap 5 detik
loadRealtimeData();
setInterval(loadRealtimeData, 5000);
</script>
{% endblock %}
